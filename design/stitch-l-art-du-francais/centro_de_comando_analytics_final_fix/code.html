<text fill="#777777" font-size="10" x="150" y="145">20</text>
</g>
<!-- Radar Chart Polygon Area (90, 75, 60, 45, 60) -->
<!-- Center (150, 150), R=100 -->
<!-- Present (90%): y = 150 - 90 = 60 -->
<!-- Past (75%): x = 150 + 75*cos(-18) = 150 + 71.3 = 221.3, y = 150 + 75*sin(-18) = 150 - 23.1 = 126.9 -->
<!-- Future (60%): x = 150 + 60*cos(54) = 150 + 35.2 = 185.2, y = 150 + 60*sin(54) = 150 + 48.5 = 198.5 -->
